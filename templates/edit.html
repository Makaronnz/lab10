{% extends "index.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow">
            <div class="card-header bg-warning text-dark">
                <h4 class="mb-0"><i class="fas fa-edit me-2"></i>Edit Comic</h4>
            </div>
            <div class="card-body p-4">
                <form action="/edit/{{ comic.id }}" method="POST" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label for="title" class="form-label fw-bold">Title</label>
                        <input type="text" class="form-control form-control-lg" id="title" name="title"
                            value="{{ comic.title }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="author" class="form-label fw-bold">Creator / Author</label>
                        <input type="text" class="form-control" id="author" name="author" value="{{ comic.author }}"
                            required>
                    </div>

                    <div class="mb-3">
                        <label for="genre" class="form-label fw-bold">Genre</label>
                        <select class="form-select" id="genre" name="genre">
                            <option value="">Select a Genre...</option>
                            {% for g in genres %}
                            <option value="{{ g }}" {% if comic.genre==g %}selected{% endif %}>{{ g }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-4">
                        <label for="cover_image" class="form-label fw-bold">New Cover Image (optional)</label>
                        <input type="file" class="form-control" id="cover_image" name="cover_image" accept="image/*">
                        {% if comic.cover_url %}
                        <div class="mt-2">
                            <p class="text-muted small mb-1">Current Cover:</p>
                            <img src="{{ comic.cover_url }}" alt="Current cover" class="img-thumbnail"
                                style="height: 100px;">
                        </div>
                        {% endif %}
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-lg">Update Comic</button>
                        <a href="/" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
