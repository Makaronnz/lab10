<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Book - Personal Library</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }

        .form-card {
            max-width: 600px;
            margin: 0 auto;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border-radius: 1rem;
            border: none;
        }
    </style>
</head>

<body>

    <div class="container mt-5">
        <div class="card form-card">
            <div class="card-body p-5">
                <h2 class="card-title text-center mb-4 text-primary fw-bold">Add New Book</h2>
                <form action="/add" method="POST" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label for="title" class="form-label fw-bold">Book Title</label>
                        <input type="text" class="form-control form-control-lg" id="title" name="title" required
                            placeholder="Enter book title">
                    </div>
                    <div class="mb-3">
                        <label for="author" class="form-label fw-bold">Author</label>
                        <input type="text" class="form-control form-control-lg" id="author" name="author" required
                            placeholder="Enter author name">
                    </div>
                    <div class="mb-4">
                        <label for="cover_image" class="form-label fw-bold">Cover Image (Optional)</label>
                        <input type="file" class="form-control" id="cover_image" name="cover_image" accept="image/*">
                        <div class="form-text">Choose an image file for the book cover.</div>
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-lg">Add Book</button>
                        <a href="/" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
