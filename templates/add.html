{% extends "index.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow">
            <div class="card-header bg-success text-white">
                <h4 class="mb-0"><i class="fas fa-plus me-2"></i>Add New Comic</h4>
            </div>
            <div class="card-body p-4">
                <form action="/add" method="POST" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label for="title" class="form-label fw-bold">Title</label>
                        <input type="text" class="form-control form-control-lg" id="title" name="title" required
                            placeholder="e.g. Solo Leveling">
                    </div>
                    <div class="mb-3">
                        <label for="author" class="form-label fw-bold">Creator / Author</label>
                        <input type="text" class="form-control" id="author" name="author" required
                            placeholder="e.g. Chugong">
                    </div>

                    <div class="mb-3">
                        <label for="genre" class="form-label fw-bold">Genre</label>
                        <select class="form-select" id="genre" name="genre">
                            <option value="" disabled selected>Select a Genre...</option>
                            {% for g in genres %}
                            <option value="{{ g }}">{{ g }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-4">
                        <label for="cover_image" class="form-label fw-bold">Cover Image</label>
                        <input type="file" class="form-control" id="cover_image" name="cover_image" accept="image/*">
                        <div class="form-text">Supported formats: JPG, PNG, GIF</div>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-lg">Add Comic</button>
                        <a href="/" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
